# Alertreck — ALSA default routed to the INMP441 I2S MEMS mic.
# Install on the Pi as /etc/asound.conf  (system-wide) then reboot or `sudo alsa reload`.
#
# Makes the I2S googlevoicehat soundcard the DEFAULT capture device, wrapped in
# `plug` so any app (sounddevice/PortAudio) can open it at 44.1 kHz mono even
# though the hardware runs 48 kHz stereo S32_LE — plug does the rate conversion
# and the 2→1 channel downmix. This is why the daemon needs no code change beyond
# MIC_DEVICE_INDEX = None.
#
# If `arecord -l` shows a different card name than `sndrpigooglevoi`, replace it
# below (and in the ctl section).

pcm.!default {
    type plug
    slave.pcm "hw:sndrpigooglevoi"
}

ctl.!default {
    type hw
    card sndrpigooglevoi
}

# Optional explicit capture alias (use device "alertreck_mic" if you prefer not to
# override the system default). INMP441 with L/R tied to GND drives the LEFT
# channel; this takes channel 0 only (avoids averaging in the silent right slot).
pcm.alertreck_mic {
    type plug
    slave.pcm "hw:sndrpigooglevoi"
    ttable.0.0 1      # capture channel 0 (left) -> mono out
}
